<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="地推登記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>地推登記</title>
<style>
  :root {
    --bg: #f3f6f5;
    --card: #ffffff;
    --text: #17211e;
    --muted: #64716c;
    --line: #dfe6e3;
    --primary: #0f766e;
    --primary-press: #0b5e57;
    --primary-soft: #e3f3f1;
    --danger: #c2410c;
    --danger-soft: #fdece4;
    --ok: #15803d;
    --shadow: 0 1px 2px rgba(15, 30, 25, .06), 0 4px 16px rgba(15, 30, 25, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1513;
      --card: #18211e;
      --text: #e7eeeb;
      --muted: #9aa8a3;
      --line: #2a3632;
      --primary: #2bb3a5;
      --primary-press: #22968a;
      --primary-soft: #16302c;
      --danger: #f08a5d;
      --danger-soft: #3a221a;
      --ok: #4ade80;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    min-height: 100vh;
  }
  [hidden] { display: none !important; }

  h1, h2 { margin: 0; line-height: 1.3; }
  .muted { color: var(--muted); }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-weight: 600;
    min-height: 48px;
    padding: 10px 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background-color .15s, transform .05s;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-press); }
  .btn-secondary { background: var(--primary-soft); color: var(--primary); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-lg { min-height: 54px; font-size: 18px; }
  .btn-xl { min-height: 62px; font-size: 20px; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 40px; padding: 6px 12px; font-size: 15px; border-radius: 10px; }
  .btn:focus-visible, input:focus-visible, .link-btn:focus-visible, .history-item:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent);
    outline-offset: 2px;
  }

  .link-btn {
    appearance: none; background: none; border: 0; padding: 8px 4px;
    font: inherit; color: var(--primary); font-weight: 600; cursor: pointer;
    min-height: 44px; justify-self: start;
  }

  /* ---------- Layout pieces ---------- */
  .topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 12px;
  }
  .topbar h1 { font-size: 19px; text-align: center; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    padding: 20px;
  }
  .stack > * + * { margin-top: 12px; }

  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field + .field { margin-top: 16px; }
  input[type="text"], input[type="email"], input[type="date"] {
    width: 100%;
    font: inherit;
    font-size: 18px; /* >=16px 避免 iOS 自動放大 */
    color: var(--text);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus { border-color: var(--primary); outline: none; background: var(--card); }
  input.invalid { border-color: var(--danger); }
  .err { color: var(--danger); font-size: 15px; margin: 6px 0 0; min-height: 1.5em; }

  .event-info {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
    padding: 12px 16px; margin-bottom: 12px;
    background: var(--primary-soft); border-radius: 12px; color: var(--text);
  }
  .event-info .place { font-weight: 700; }
  .event-info .date { color: var(--muted); font-size: 15px; }
  .count { font-size: 15px; color: var(--muted); white-space: nowrap; }
  .count b { color: var(--primary); font-size: 22px; margin: 0 2px; }

  /* ---------- Home ---------- */
  .home-hero {
    min-height: 60vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 20px; background: var(--primary); color: #fff;
    display: grid; place-items: center; margin-bottom: 8px;
  }
  .home-hero h1 { font-size: 28px; }
  .home-hero p { margin: 0 0 24px; }
  .home-hero .btn { width: min(100%, 360px); }

  .section-title { font-size: 15px; color: var(--muted); font-weight: 600; margin: 8px 4px 8px; }
  .history-list { list-style: none; margin: 0; padding: 0; }
  .history-list li + li { margin-top: 8px; }
  .history-item {
    width: 100%; text-align: left; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    min-height: 56px;
  }
  .history-item .meta { color: var(--muted); font-size: 14px; }
  .history-item .n { color: var(--primary); font-weight: 700; white-space: nowrap; }

  /* ---------- Entry ---------- */
  #screen-entry .card .btn { margin-top: 4px; }
  #btn-view-list { margin-top: 12px; }

  /* ---------- List ---------- */
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .toolbar .btn { flex: 1; }
  .email-list { list-style: none; margin: 0; padding: 0; }
  .email-list li {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  }
  .email-list li + li { margin-top: 8px; }
  .email-list .num { color: var(--muted); font-size: 14px; min-width: 1.8em; text-align: right; font-variant-numeric: tabular-nums; }
  .email-list .addr { overflow-wrap: anywhere; font-size: 17px; }
  .email-list .actions { display: flex; gap: 6px; }
  .email-list li.editing { grid-template-columns: auto 1fr; }
  .email-list li.editing .edit-wrap { grid-column: 2; }
  .email-list li.editing .actions { grid-column: 2; justify-content: flex-end; }
  .email-list .edit-wrap input { min-height: 46px; padding: 8px 12px; }
  .email-list .edit-wrap .err { min-height: 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* ---------- Toast / banner ---------- */
  .toast {
    position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top));
    transform: translate(-50%, -20px);
    opacity: 0; visibility: hidden;
    background: var(--ok); color: #fff; font-weight: 700; font-size: 18px;
    padding: 12px 22px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    transition: transform .25s ease, opacity .25s ease, visibility .25s;
    z-index: 50; pointer-events: none; white-space: nowrap;
  }
  .toast.error { background: var(--danger); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  @media (prefers-color-scheme: dark) { .toast { color: #0f1513; } }

  .banner {
    background: var(--danger-soft); color: var(--danger); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 12px; font-size: 15px;
  }

  @media (prefers-reduced-motion: reduce) {
    .toast, .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="storage-banner" class="banner" hidden>
    ⚠ 這個瀏覽器目前無法保存資料（可能是無痕模式）。關閉頁面後資料會消失，請記得先匯出。
  </div>

  <!-- 1. 進入畫面 -->
  <section id="screen-home" hidden>
    <div class="home-hero">
      <div class="logo" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </div>
      <h1>地推登記</h1>
      <p class="muted">活動現場快速收集 email</p>
      <button type="button" class="btn btn-primary btn-xl" id="btn-new">＋ 新增地推活動</button>
    </div>
    <div id="history" hidden>
      <h2 class="section-title">過往活動</h2>
      <ul id="history-list" class="history-list"></ul>
    </div>
  </section>

  <!-- 2. 新增活動 -->
  <section id="screen-create" hidden>
    <header class="topbar">
      <button type="button" class="link-btn" data-go="home">‹ 返回</button>
      <h1>新增地推活動</h1>
      <span></span>
    </header>
    <form id="form-create" class="card" novalidate>
      <div class="field">
        <label for="in-date">活動日期</label>
        <input type="date" id="in-date" required>
      </div>
      <div class="field">
        <label for="in-place">舉辦地點</label>
        <input type="text" id="in-place" maxlength="60" placeholder="例如：台北車站東三門" autocomplete="off" enterkeyhint="done" required>
      </div>
      <p class="err" id="err-create" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-lg btn-block">確認新增</button>
    </form>
  </section>

  <!-- 3/4. 輸入 email -->
  <section id="screen-entry" hidden>
    <header class="topbar">
      <button type="button" class="link-btn" data-go="home">‹ 首頁</button>
      <h1>登記 Email</h1>
      <span></span>
    </header>
    <div class="event-info">
      <div>
        <div class="place" data-bind="place"></div>
        <div class="date" data-bind="date"></div>
      </div>
      <div class="count">已登記<b data-bind="count">0</b>筆</div>
    </div>
    <form id="form-entry" class="card" novalidate>
      <label for="in-email">Email</label>
      <input type="email" id="in-email" inputmode="email" placeholder="name@example.com"
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <p class="err" id="err-email" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-xl btn-block">儲存</button>
    </form>
    <button type="button" class="btn btn-secondary btn-lg btn-block" id="btn-view-list">看所有登記資料</button>
  </section>

  <!-- 5/6. 登記清單 -->
  <section id="screen-list" hidden>
    <header class="topbar">
      <button type="button" class="link-btn" data-go="entry">‹ 返回輸入</button>
      <h1>所有登記資料</h1>
      <span></span>
    </header>
    <div class="event-info">
      <div>
        <div class="place" data-bind="place"></div>
        <div class="date" data-bind="date"></div>
      </div>
      <div class="count">共<b data-bind="count">0</b>筆</div>
    </div>
    <div class="toolbar">
      <button type="button" class="btn btn-primary" id="btn-export">匯出 TXT</button>
      <button type="button" class="btn btn-secondary" id="btn-copy">複製全部</button>
    </div>
    <ol id="email-list" class="email-list"></ol>
    <p id="list-empty" class="empty" hidden>還沒有任何登記資料</p>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ================= 資料儲存 ================= */
  var STORE_KEY = 'streetSignup.v1';
  var storageOK = (function () {
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; }
    catch (e) { return false; }
  })();

  function load() {
    if (storageOK) {
      try {
        var s = JSON.parse(localStorage.getItem(STORE_KEY));
        if (s && Array.isArray(s.events)) return s;
      } catch (e) { /* 資料損毀時重新開始 */ }
    }
    return { events: [], currentId: null, screen: 'home' };
  }

  var state = load();

  function persist() {
    if (!storageOK) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { toast('儲存空間寫入失敗，請先匯出資料', 'error'); }
  }

  // 請瀏覽器盡量不要自動清掉資料（支援的瀏覽器才有作用）
  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist(); } catch (e) {}
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function currentEvent() {
    for (var i = 0; i < state.events.length; i++) if (state.events[i].id === state.currentId) return state.events[i];
    return null;
  }

  /* ================= 工具 ================= */
  var $ = function (id) { return document.getElementById(id); };

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtDate(iso) {
    var p = iso.split('-').map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    return p[0] + '/' + pad(p[1]) + '/' + pad(p[2]) + '（' + '日一二三四五六'[dt.getDay()] + '）';
  }

  // 全形英數符號轉半形（避免中文輸入法打出「＠」「．」）並去除前後空白
  function normalizeEmail(v) {
    return v.replace(/[！-～]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    }).replace(/　/g, ' ').trim();
  }

  // 簡單 email 檢核：xxx@網域.頂級網域（頂級網域至少 2 個英文字母）
  var EMAIL_RE = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[A-Za-z]{2,}$/;
  function validateEmail(v, ev, exceptId) {
    if (!v) return '請輸入 email';
    if (v.indexOf('@') === -1) return 'Email 少了「@」，請再確認一次';
    if (!EMAIL_RE.test(v)) return 'Email 格式不正確，例如：name@gmail.com';
    var lower = v.toLowerCase();
    for (var i = 0; i < ev.emails.length; i++) {
      var e = ev.emails[i];
      if (e.id !== exceptId && e.email.toLowerCase() === lower) return '這個 email 已經登記過了';
    }
    return '';
  }

  var toastTimer;
  function toast(msg, type) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || 'ok');
    void t.offsetWidth; // 重新觸發動畫
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ================= 畫面切換 ================= */
  var SCREENS = ['home', 'create', 'entry', 'list'];
  var editingId = null;

  function go(screen) {
    if ((screen === 'entry' || screen === 'list') && !currentEvent()) screen = 'home';
    state.screen = screen;
    editingId = null;
    persist();
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    var screen = state.screen;
    if (SCREENS.indexOf(screen) === -1 || ((screen === 'entry' || screen === 'list') && !currentEvent())) {
      screen = state.screen = 'home';
    }
    SCREENS.forEach(function (s) { $('screen-' + s).hidden = s !== screen; });

    var ev = currentEvent();
    if (ev) {
      document.querySelectorAll('[data-bind="place"]').forEach(function (n) { n.textContent = ev.place; });
      document.querySelectorAll('[data-bind="date"]').forEach(function (n) { n.textContent = fmtDate(ev.date); });
      document.querySelectorAll('[data-bind="count"]').forEach(function (n) { n.textContent = ev.emails.length; });
    }

    if (screen === 'home') renderHome();
    if (screen === 'create') {
      $('in-date').value = todayISO();
      $('in-place').value = '';
      $('err-create').textContent = '';
    }
    if (screen === 'entry') {
      $('err-email').textContent = '';
      $('in-email').classList.remove('invalid');
    }
    if (screen === 'list') renderList();
  }

  /* ---------- 首頁 ---------- */
  function renderHome() {
    var list = $('history-list');
    list.replaceChildren();
    var events = state.events.slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt;
    });
    $('history').hidden = events.length === 0;
    events.forEach(function (ev) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'history-item';
      var left = document.createElement('div');
      var place = document.createElement('div');
      place.textContent = ev.place;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = fmtDate(ev.date);
      left.append(place, meta);
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = ev.emails.length + ' 筆 ›';
      btn.append(left, n);
      btn.addEventListener('click', function () { state.currentId = ev.id; go('entry'); });
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  $('btn-new').addEventListener('click', function () { go('create'); });

  /* ---------- 新增活動 ---------- */
  $('form-create').addEventListener('submit', function (e) {
    e.preventDefault();
    var date = $('in-date').value;
    var place = $('in-place').value.trim();
    if (!date) { $('err-create').textContent = '請選擇活動日期'; $('in-date').focus(); return; }
    if (!place) { $('err-create').textContent = '請輸入舉辦地點'; $('in-place').focus(); return; }
    var ev = { id: uid(), date: date, place: place, createdAt: Date.now(), emails: [] };
    state.events.push(ev);
    state.currentId = ev.id;
    go('entry');
    toast('活動已建立');
    setTimeout(function () { $('in-email').focus(); }, 50);
  });

  /* ---------- 輸入 email ---------- */
  $('form-entry').addEventListener('submit', function (e) {
    e.preventDefault();
    var ev = currentEvent();
    if (!ev) return go('home');
    var input = $('in-email');
    var v = normalizeEmail(input.value);
    var msg = validateEmail(v, ev, null);
    if (msg) {
      $('err-email').textContent = msg;
      input.classList.add('invalid');
      input.focus();
      return;
    }
    ev.emails.push({ id: uid(), email: v, createdAt: Date.now() });
    persist();
    input.value = '';
    $('err-email').textContent = '';
    input.classList.remove('invalid');
    document.querySelectorAll('[data-bind="count"]').forEach(function (n) { n.textContent = ev.emails.length; });
    toast('✓ 已儲存');
    input.focus();
  });

  $('in-email').addEventListener('input', function () {
    if ($('err-email').textContent) {
      $('err-email').textContent = '';
      this.classList.remove('invalid');
    }
  });

  $('btn-view-list').addEventListener('click', function () { go('list'); });

  /* ---------- 清單：編輯 / 刪除 ---------- */
  function makeBtn(text, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn btn-sm ' + cls;
    b.textContent = text;
    b.addEventListener('click', onClick);
    return b;
  }

  function renderList() {
    var ev = currentEvent();
    var list = $('email-list');
    list.replaceChildren();
    $('list-empty').hidden = ev.emails.length > 0;
    document.querySelectorAll('[data-bind="count"]').forEach(function (n) { n.textContent = ev.emails.length; });

    ev.emails.forEach(function (item, i) {
      var li = document.createElement('li');
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = (i + 1) + '.';
      li.appendChild(num);

      var actions = document.createElement('div');
      actions.className = 'actions';

      if (editingId === item.id) {
        li.className = 'editing';
        var wrap = document.createElement('div');
        wrap.className = 'edit-wrap';
        var input = document.createElement('input');
        input.type = 'email';
        input.value = item.email;
        input.setAttribute('inputmode', 'email');
        input.setAttribute('autocapitalize', 'none');
        input.setAttribute('autocorrect', 'off');
        input.setAttribute('spellcheck', 'false');
        input.setAttribute('aria-label', '編輯 email');
        var err = document.createElement('p');
        err.className = 'err';
        err.setAttribute('role', 'alert');
        wrap.append(input, err);

        var doSave = function () {
          var v = normalizeEmail(input.value);
          var msg = validateEmail(v, ev, item.id);
          if (msg) { err.textContent = msg; input.classList.add('invalid'); input.focus(); return; }
          item.email = v;
          item.updatedAt = Date.now();
          editingId = null;
          persist();
          renderList();
          toast('✓ 已更新');
        };
        var doCancel = function () { editingId = null; renderList(); };
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); doSave(); }
          if (e.key === 'Escape') { e.preventDefault(); doCancel(); }
        });
        input.addEventListener('input', function () { err.textContent = ''; input.classList.remove('invalid'); });

        actions.append(makeBtn('取消', 'btn-ghost', doCancel), makeBtn('儲存', 'btn-primary', doSave));
        li.append(wrap, actions);
        setTimeout(function () { input.focus(); input.select(); }, 0);
      } else {
        var addr = document.createElement('span');
        addr.className = 'addr';
        addr.textContent = item.email;
        actions.append(
          makeBtn('編輯', 'btn-secondary', function () { editingId = item.id; renderList(); }),
          makeBtn('刪除', 'btn-danger', function () {
            if (!confirm('確定要刪除這筆資料嗎？\n\n' + item.email)) return;
            ev.emails = ev.emails.filter(function (x) { return x.id !== item.id; });
            if (editingId === item.id) editingId = null;
            persist();
            renderList();
            toast('已刪除');
          })
        );
        li.append(addr, actions);
      }
      list.appendChild(li);
    });
  }

  /* ---------- 匯出 TXT / 複製 ---------- */
  function emailsText(ev) {
    return ev.emails.map(function (e) { return e.email; }).join('\r\n') + '\r\n';
  }

  $('btn-export').addEventListener('click', function () {
    var ev = currentEvent();
    if (!ev.emails.length) return toast('目前沒有資料可以匯出', 'error');
    var name = ('地推名單_' + ev.date + '_' + ev.place).replace(/[\\\/:*?"<>|\s]+/g, '_') + '.txt';
    var blob = new Blob([emailsText(ev)], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('已匯出 ' + ev.emails.length + ' 筆');
  });

  $('btn-copy').addEventListener('click', function () {
    var ev = currentEvent();
    if (!ev.emails.length) return toast('目前沒有資料可以複製', 'error');
    var text = emailsText(ev);
    var done = function () { toast('已複製 ' + ev.emails.length + ' 筆'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      ok ? done() : toast('複製失敗，請改用匯出', 'error');
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  });

  /* ---------- 返回按鈕 ---------- */
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
  });

  /* ---------- 啟動 ---------- */
  if (!storageOK) $('storage-banner').hidden = false;
  render(); // 重新整理或重新開啟時，回到上次的畫面

  // 放在網站上（例如 GitHub Pages）時啟用離線快取；直接點兩下開檔案時會略過
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
